services:
  api:
    build:
      context: .
      dockerfile: src/OrdersBackend.Api/Dockerfile
    image: orders-backend
    container_name: orders-backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__OrdersDb: "Data Source=/app/data/orders.db"
    volumes:
      - orders-data:/app/data

volumes:
  orders-data:
